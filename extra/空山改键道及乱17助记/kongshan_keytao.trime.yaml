# Trime 3.3.12+：按截图适配，独立维护，不由元书 main.jsonnet 生成。
# 键位与颜色参考 jsonnet/Buttons/Layout26.libsonnet 和 Constants/Colors.libsonnet。

config_version: "3.0"
name: 空山键道 26 键
author: 空山素影／键道助记版（Trime 适配）

style:
  auto_caps: false
  candidate_padding: 5
  candidate_spacing: 0
  candidate_text_size: 18
  candidate_view_height: 32
  comment_position: right
  comment_text_size: 12
  horizontal_gap: 6
  vertical_gap: 8
  key_height: 52
  key_text_size: 22
  key_long_text_size: 16
  key_width: 10
  label_text_size: 18
  round_corner: 11
  shadow_radius: 0
  symbol_text_size: 10
  keyboard_height: 220
  keyboard_height_land: 220
  enter_label_mode: 2
  enter_labels:
    search: 搜索
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    send: 发送
    default: 回车

preedit:
  horizontal_padding: 8
  top_start_radius: 8
  top_end_radius: 8
  foreground:
    font_size: 16

window:
  insets:
    vertical: 4
    horizontal: 4
  item_padding:
    horizontal: 4
  foreground:
    label_font_size: 18
    text_font_size: 20
    comment_font_size: 14

fallback_colors:
  candidate_text_color: text_color
  comment_text_color: comment_color
  border_color: keyboard_color
  hilited_text_color: text_color
  hilited_back_color: keyboard_color
  hilited_candidate_text_color: white
  hilited_candidate_back_color: blue
  hilited_key_back_color: key_highlight
  hilited_key_text_color: white
  hilited_key_symbol_color: white
  key_back_color: normal_key
  key_text_color: white
  key_symbol_color: white
  label_color: white
  off_key_back_color: function_key
  off_key_text_color: white
  on_key_back_color: blue
  on_key_text_color: white
  root_background: keyboard_color
  candidate_background: keyboard_color
  keyboard_back_color: keyboard_color
  text_back_color: keyboard_color
  hilited_off_key_back_color: key_highlight
  hilited_off_key_text_color: white
  hilited_on_key_back_color: key_highlight
  hilited_on_key_text_color: white
  preview_back_color: normal_key
  preview_text_color: white
  popup_back_color: normal_key
  popup_text_color: white
  hilited_popup_text_color: white
  liquid_keyboard_background: keyboard_color
  long_text_back_color: normal_key

preset_color_schemes:
  kongshan:
    name: 空山深色
    author: sunteya
    text_color: 0xffffffff
    candidate_text_color: 0xffffffff
    comment_color: 0xffc7c9cc
    back_color: 0xff202528
    keyboard_color: 0xff202528
    normal_key: 0xff66686c
    key_highlight: 0xff85878a
    function_key: 0xff34383c
    white: 0xffffffff
    blue: 0xff00b8d4
    green: 0xff50a545
    q_back: 0xff86b953
    w_back: 0xffff9800
    u_back: 0xff00bcd4
    i_back: 0xff00bcd4
    o_back: 0xff00bcd4
    a_back: 0xff00bcd4
    f_back: 0xff86b953
    j_back: 0xffff9800
    x_back: 0xffed3857
    v_back: 0xff00bcd4
    key_border_color: 0x00000000
    hilited_candidate_back_color: 0xff00a9c2
    hilited_candidate_text_color: 0xffffffff
    shadow_color: 0x00000000

preset_keys:
  Shift_L: {label: "⇧", send: Shift_L, shift_lock: ascii_long}
  Return: {label: enter_labels, send: Return}
  BackSpace: {label: "⌫", send: BackSpace, repeatable: true}
  space: {send: space, functional: false}
  Mode_switch: {toggle: ascii_mode, send: SWITCH_CHARSET, states: ["中/En", "En/中"]}
  Keyboard_number: {label: "123", send: Eisu_toggle, select: number}
  Keyboard_symbols: {label: "#", send: Eisu_toggle, select: symbols}
  Keyboard_symbols_more: {label: "#+=", send: Eisu_toggle, select: symbols_more}
  Keyboard_default: {label: "ABC", send: Eisu_toggle, select: default}
  Hide: {label: "⌄", send: BACK}
  Menu: {label: 方案, send: MENU}
  Settings: {label: 设置, send: SETTINGS}
  clipboard_window: {label: 剪贴板, command: clipboard_window, option: "0"}
  liquid_keyboard_emoji: {label: 表情, command: liquid_keyboard, option: emoji}
  liquid_keyboard_exit: {label: "ABC", command: liquid_keyboard, option: "-1"}
  select_all: {label: 全选, send: Control+a}
  cut: {label: 剪切, send: Control+x}
  copy: {label: 复制, send: Control+c}
  paste: {label: 粘贴, send: Control+v}
  undo: {label: 撤销, send: Control+z}

tool_bar:
  button_spacing: 4
  primary_button:
    background:
      type: circle
      normal: 0x00
      highlight: key_highlight
      vertical_inset: 4
      horizontal_inset: 4
    foreground:
      style: "ic@toggle_switch_outline"
      normal: white
      padding: 10
    action: Menu
    long_press_action: Settings
  buttons:
    # Trime 的按钮列表从右向左排列。
    - foreground: {style: "ic@keyboard_close", normal: white, padding: 10}
      action: Hide
    - foreground: {style: "ic@clipboard_outline", normal: white, padding: 10}
      action: clipboard_window
    - foreground: {style: "ic@emoticon_outline", normal: white, padding: 10}
      action: liquid_keyboard_emoji
    - foreground: {style: "ic@pound", normal: white, padding: 10}
      action: Keyboard_symbols

liquid_keyboard:
  row: 4
  row_land: 4
  key_height: 48
  key_height_land: 48
  single_width: 48
  vertical_gap: 6
  margin_x: 4
  fixed_key_bar:
    position: bottom
    keys: [liquid_keyboard_exit, space, BackSpace, Return]
  keyboards: [emoji]
  emoji:
    name: 表情
    type: SINGLE
    keys: "😀😄😁😆😂🤣🥹😊🙂🙃😉😍🥰😘😋😎🤔😅🥲😭😤😡😱🥺👍👎👏🙏💪❤️💔🎉🌹✨🔥☀️🌙"

preset_keyboards:
  default:
    name: 空山键道 26 键
    author: sunteya
    ascii_mode: 0
    reset_ascii_mode: false
    label_transform: uppercase
    width: 10
    key_text_offset_y: 10
    key_hint_offset_y: -24
    keys:
      # 第一行：QWERTY + 数字 / 符号提示
      - {click: q, label_symbol: "1", hint: "⇥", swipe_up: "1", swipe_down: "Tab", key_back_color: q_back}
      - {click: w, label_symbol: "2", swipe_up: "2", key_back_color: w_back}
      - {click: e, label_symbol: "3", swipe_up: "3"}
      - {click: r, label_symbol: "4", swipe_up: "4"}
      - {click: t, label_symbol: "5", swipe_up: "5"}
      - {click: y, label_symbol: "6", swipe_up: "6"}
      - {click: u, label_symbol: "7", swipe_up: "7", key_back_color: u_back}
      - {click: i, label_symbol: "8", hint: "|", swipe_up: "8", swipe_down: "|", key_back_color: i_back}
      - {click: o, label_symbol: "9", hint: "<", swipe_up: "9", swipe_down: "<", key_back_color: o_back}
      - {click: p, label_symbol: "0", hint: ">", swipe_up: "0", swipe_down: ">"}

      # 第二行：左右留白，模拟截图中的错位排列
      - {width: 5}
      - {click: a, label_symbol: "!", hint: "全", swipe_up: "!", swipe_down: select_all, key_back_color: a_back}
      - {click: s, label_symbol: "^", hint: "%", swipe_up: "^", swipe_down: "%"}
      - {click: d, label_symbol: "/", hint: "\\", swipe_up: "/", swipe_down: "\\"}
      - {click: f, label_symbol: ";", hint: ":", swipe_up: ";", swipe_down: ":", key_back_color: f_back}
      - {click: g, label_symbol: "(", hint: ")", swipe_up: "(", swipe_down: ")"}
      - {click: h, label_symbol: "-", hint: "_", swipe_up: "-", swipe_down: "_"}
      - {click: j, label_symbol: "#", hint: "+", swipe_up: "#", swipe_down: "+", key_back_color: j_back}
      - {click: k, label_symbol: "{", hint: "}", swipe_up: "{", swipe_down: "}"}
      - {click: l, label_symbol: "\"", hint: "'", swipe_up: "\"", swipe_down: "'"}
      - {width: 5}

      # 第三行：Shift、编辑快捷键和退格
      - {click: Shift_L, long_click: Shift_L, label_symbol: " ", composing: ";", width: 15, key_text_offset_y: 0.01, key_back_color: function_key, key_text_color: white}
      - {click: z, label_symbol: "@", hint: "↶", swipe_up: "@", swipe_down: undo, long_click: undo}
      - {click: x, label_symbol: "*", hint: "✂", swipe_up: "*", swipe_down: cut, long_click: cut, key_back_color: x_back}
      - {click: c, label_symbol: "`", hint: "复", swipe_up: "`", swipe_down: copy, long_click: copy}
      - {click: v, label_symbol: "=", hint: "贴", swipe_up: "=", swipe_down: paste, long_click: paste, key_back_color: v_back}
      - {click: b, label_symbol: "[", hint: "]", swipe_up: "[", swipe_down: "]"}
      - {click: n, label_symbol: "&", hint: "~", swipe_up: "&", swipe_down: "~"}
      - {click: m, label_symbol: "?", hint: "$", swipe_up: "?", swipe_down: "$"}
      - {click: BackSpace, width: 15, key_text_offset_y: 0.01, key_back_color: function_key, key_text_color: white}

      # Trime 把 offset=0 当作继承；0.01 用于让功能键文字近似居中。
      - {click: Keyboard_symbols, label_symbol: " ", swipe_up: Keyboard_number, swipe_down: liquid_keyboard_emoji, long_click: Keyboard_number, width: 20, key_text_offset_y: 0.01, key_back_color: function_key, key_text_color: white}
      - {click: ",", label_symbol: "。", swipe_up: ".", width: 10, key_text_offset_y: 0.01}
      - {click: space, width: 38, key_text_offset_y: 0.01, key_back_color: normal_key, key_text_color: white}
      - {click: Mode_switch, long_click: Menu, label_symbol: " ", width: 10, key_text_size: 13, key_text_offset_y: 0.01, key_back_color: function_key, key_text_color: white}
      - {click: Return, width: 22, key_text_size: 20, key_text_offset_y: 0.01, key_back_color: green, key_text_color: white}

  number:
    name: 数字键盘
    author: sunteya
    reset_ascii_mode: false
    width: 20
    keys:
      - {click: "1"}
      - {click: "2"}
      - {click: "3"}
      - {click: "4"}
      - {click: "5"}

      - {click: "6"}
      - {click: "7"}
      - {click: "8"}
      - {click: "9"}
      - {click: "+"}

      - {click: "-"}
      - {click: "."}
      - {click: "0"}
      - {click: BackSpace}
      - {click: Keyboard_symbols}

      - {click: Keyboard_default}
      - {click: space, width: 40}
      - {click: Return, width: 40, key_back_color: green, key_text_color: white}

  symbols:
    name: 数字符号键盘
    author: sunteya
    reset_ascii_mode: false
    width: 10
    keys:
      - {click: "1"}
      - {click: "2"}
      - {click: "3"}
      - {click: "4"}
      - {click: "5"}
      - {click: "6"}
      - {click: "7"}
      - {click: "8"}
      - {click: "9"}
      - {click: "0"}

      - {click: "-"}
      - {click: "/"}
      - {click: ":"}
      - {click: ";"}
      - {click: "("}
      - {click: ")"}
      - {click: "¥"}
      - {click: "@"}
      - {click: "“"}
      - {click: "”"}

      - {click: Keyboard_symbols_more, width: 15, key_back_color: function_key}
      - {click: "+"}
      - {click: "*"}
      - {click: "、"}
      - {click: "#"}
      - {click: "?"}
      - {click: "!"}
      - {click: "."}
      - {click: BackSpace, width: 15, key_back_color: function_key}

      - {click: Keyboard_default, label: "←", width: 20, key_back_color: green}
      - {click: "。"}
      - {click: space, label: "␣", width: 38}
      - {click: "="}
      - {click: Return, width: 22, key_text_size: 20, key_back_color: green}

  symbols_more:
    name: 更多符号
    author: sunteya
    reset_ascii_mode: false
    width: 10
    keys:
      - {click: "，"}
      - {click: "。"}
      - {click: "？"}
      - {click: "！"}
      - {click: "、"}
      - {click: "："}
      - {click: "；"}
      - {click: "（"}
      - {click: "）"}
      - {click: "【"}

      - {click: "】"}
      - {click: "《"}
      - {click: "》"}
      - {click: "“"}
      - {click: "”"}
      - {click: "‘"}
      - {click: "’"}
      - {click: "～"}
      - {click: "…"}
      - {click: BackSpace}

      - {click: Keyboard_default}
      - {click: Keyboard_symbols}
      - {click: liquid_keyboard_emoji}
      - {click: space, width: 50}
      - {click: Return, width: 20, key_back_color: green, key_text_color: white}
